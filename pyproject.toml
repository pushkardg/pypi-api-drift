[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypi-api-drift"
version = "1.3.3"
description = "Check Python code against the real public API of pinned library versions (PyPI API Drift dataset)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA.md"]
authors = [{name = "Pushkar Devanahalli Gopalakrishna"}]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "pyarrow>=12", "packaging>=21"]
keywords = ["api", "breaking-changes", "llm", "code-generation", "static-analysis", "pypi", "semver"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pushkardg/pypi-api-drift"
Dataset = "https://huggingface.co/datasets/pushkar87dg/pypi-api-drift"
Source = "https://github.com/pushkardg/pypi-api-drift"
Issues = "https://github.com/pushkardg/pypi-api-drift/issues"
Paper = "https://doi.org/10.5281/zenodo.23648339"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
apidrift-check = "apidrift.check:main"
apidrift-lookup = "apidrift.lookup:main"
apidrift-mcp = "apidrift.mcp_server:main"

[tool.setuptools]
packages = ["apidrift"]
